name: Deploy to Apps Script

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run verify

      - name: Restore clasp credentials
        run: echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json

      - name: Push to Apps Script
        run: npx clasp push -f

      - name: Deploy existing deployment
        run: npx clasp deploy -i ${{ secrets.DEPLOYMENT_ID }} -d "auto deploy from $GITHUB_SHA"
