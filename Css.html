<style>
:root{
  --ink:#262019; --accent:#6E5D89; --accent-soft:#ECE6F2;
  --line:#E6DFD2; --muted:#857D6E; --bg:#F6F3EC; --surface:#FFFEFB; --sub:#FAF7F2;
  --ok:#3F6B4A; --err:#A83A3A; --warn:#96702A; --ask:#4A5C7A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;line-height:1.55;color:var(--ink);background:var(--bg);
}
.hidden{display:none !important}
.inner{max-width:600px;margin:0 auto;padding:0 16px}
.center{text-align:center}

/* ── 진입 ─────────────────────────── */
.screen{min-height:100vh}
#gate,#resume{display:flex;align-items:center;justify-content:center;padding:24px 16px}
.gate-box{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:28px 22px}
.gate-box h1{font-size:21px;line-height:1.35;margin:0 0 6px;color:var(--ink)}
.gate-box .sub{font-size:13px;color:var(--muted);margin:0 0 22px}
label{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=tel],input[type=number],input[type=time],select,textarea{
  width:100%;padding:12px;font-size:16px;font-family:inherit;
  border:1px solid #DCD3C4;border-radius:8px;background:var(--surface);color:var(--ink);
}
input:focus,select:focus,textarea:focus{outline:3px solid var(--accent-soft);border-color:var(--accent)}
textarea{min-height:110px;resize:vertical;line-height:1.6}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0}
.err{font-size:13px;color:var(--err);margin:12px 0 0;min-height:18px}

button{
  width:100%;margin-top:16px;padding:14px;font-size:15px;font-weight:700;
  border:0;border-radius:8px;background:var(--accent);color:#fff;
  font-family:inherit;cursor:pointer;
}
button:disabled{background:#C7BFB0;cursor:default}
button.ghost{background:var(--surface);color:var(--accent);border:1px solid #DACFC0;font-weight:600}
button.ghost:disabled{background:#F2EEE5;color:#B8AF9E;border-color:var(--line);cursor:default}

/* ── 상단 ─────────────────────────── */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;height:46px}
.shop{font-weight:700;font-size:14px;color:var(--ink);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.saveState{font-size:12px;color:var(--muted);white-space:nowrap;margin-left:10px}

.mprog{padding:0 16px 10px}
.mbar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.mbar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.mlabel{font-size:12px;color:var(--muted);margin-top:5px}

.stepper{display:none}
@media(min-width:760px){
  .mprog{display:none}
  .stepper{display:flex;gap:4px;max-width:900px;margin:0 auto;padding:0 16px 12px;overflow:hidden}
  .stepper .st{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);
    padding:8px 2px;border-top:3px solid var(--line);cursor:pointer;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .stepper .st.done{color:var(--ok);border-top-color:var(--ok)}
  .stepper .st.cur{color:var(--accent);font-weight:700;border-top-color:var(--accent)}
  .inner{max-width:720px}
}

/* ── 본문 ─────────────────────────── */
main.inner{padding-top:18px;padding-bottom:110px}
.page-h{font-size:19px;color:var(--ink);margin:0 0 4px;letter-spacing:-0.01em}
.page-sub{font-size:13px;color:var(--muted);margin:0 0 18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px}
.card > h3{font-size:14px;margin:0 0 12px;color:var(--ink)}
.row{display:flex;gap:10px}
.row > *{flex:1;min-width:0}
.readonly{background:var(--sub);color:var(--muted)}

.placeholder{border:2px dashed #D9CFBF;border-radius:10px;padding:34px 18px;
  text-align:center;color:var(--muted);font-size:14px;background:var(--sub)}
.placeholder b{color:var(--ink)}

/* 있는 것만 탭으로 고르는 칩 (편의시설 등) */
.chip-toggle{display:inline-flex;align-items:center;cursor:pointer;user-select:none}
.chip-toggle input{position:absolute;opacity:0;width:0;height:0}
.chip-toggle span{
  padding:7px 14px;font-size:13px;font-weight:600;border-radius:16px;
  border:1px solid #DACFC0;background:var(--surface);color:var(--muted);transition:background .12s,color .12s,border-color .12s;
}
.chip-toggle input:checked + span{background:var(--accent);border-color:var(--accent);color:#fff}
.chip-toggle input:focus-visible + span{outline:2px solid var(--accent);outline-offset:1px}

/* 시술메뉴 아코디언 · 카드 */
.acc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;
  cursor:pointer;margin:-16px -16px 12px;padding:16px;border-bottom:1px solid var(--line)}
.acc-caret{color:var(--muted);font-size:12px}
.menu-card{background:var(--sub);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.menu-card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.menu-card-left{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.menu-card-left .acc-caret{flex:0 0 auto}
.menu-card-summary{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.menu-actions .meta{white-space:nowrap}
.menu-actions button{width:auto;margin:0;padding:4px 10px;font-size:12px}
.acc-head .menu-card-left{cursor:pointer}
.acc-head .menu-actions{margin:0}
table.mprev{width:100%;border-collapse:collapse;font-size:12px;margin:10px 0}
table.mprev th,table.mprev td{border:1px solid var(--line);padding:5px 7px;text-align:left}
table.mprev th{background:var(--sub);color:var(--muted);font-weight:700}

/* 영업시간 요일 행 */
.hrs-row{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--sub)}
.hrs-row .row{display:flex;gap:10px}
.hrs-row .row>div{flex:1;min-width:0}
.hrs-row label{margin:0 0 6px;font-size:12px}
.hrs-row summary{font-size:12px;color:var(--muted);cursor:pointer;margin:8px 0 0;list-style:none}
.hrs-row summary::-webkit-details-marker{display:none}
.hrs-row summary::before{content:'▸ ';font-size:10px}
.hrs-row details[open] summary::before{content:'▾ '}

/* 상태 뱃지 */
.badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:10px}
.b-ok{background:#E7F0E7;color:var(--ok)}
.b-warn{background:#F5EBD8;color:var(--warn)}
.b-ask{background:#E9ECF1;color:var(--ask)}
.b-err{background:#F5E6E3;color:var(--err)}

/* 업로드 */
.drop{border:2px dashed #D9CFBF;border-radius:10px;padding:26px 16px;text-align:center;
  color:var(--muted);font-size:14px;background:var(--sub);cursor:pointer}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
input[type=file]{display:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 6px}
.bar>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
ul.log{list-style:none;margin:10px 0 0;padding:0;font-size:13px}
ul.log li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
ul.log li:first-child{border-top:0}
.name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{color:var(--muted);font-size:12px;white-space:nowrap}
.st-ok{color:var(--ok);font-weight:700}
.st-err{color:var(--err);font-weight:700}
.st-run{color:var(--accent)}

/* 검토 */
.rev{list-style:none;margin:0;padding:0;font-size:14px}
.rev li{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rev li:first-child{border-top:0}
.rev .t{flex:1}
.rev .go{font-size:12px;color:var(--accent);cursor:pointer;text-decoration:underline;white-space:nowrap}

/* 하단 알림 — 오류를 화면에 띄웁니다 (모바일은 콘솔을 못 봅니다) */
.toast{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(78px + env(safe-area-inset-bottom));
  max-width:min(92vw,560px);z-index:60;
  background:#2A2420;color:#fff;font-size:13px;line-height:1.55;
  padding:12px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.28);
  opacity:0;pointer-events:none;transition:opacity .18s;
  word-break:break-word;cursor:pointer;
}
.toast.on{opacity:1;pointer-events:auto}

/* ── 하단 고정 ────────────────────── */
.foot{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);
  border-top:1px solid var(--line);padding:10px 0;
  padding-bottom:calc(10px + env(safe-area-inset-bottom))}
.foot .row{gap:10px}
.foot button{margin-top:0}
.foot .ghost{flex:0 0 34%}
</style>
